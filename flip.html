<script>
  const WORKER_URL = "https://bezeru-intelligence-api.yousef-qubain.workers.dev";

  const $ = id => document.getElementById(id);
  const brandEl       = $("brand");
  const refEl         = $("ref");
  const purchaseEl    = $("purchase");
  const premiumEl     = $("premium");
  const serviceEl     = $("service");
  const shippingInEl  = $("shipping-in");
  const salePriceEl   = $("sale-price");
  const platformEl    = $("platform");
  const feeCustomEl   = $("fee-custom");
  const shippingOutEl = $("shipping-out");
  const countryEl     = $("country");
  const holdEl        = $("hold");
  const aiBtn         = $("ai-btn");

  const fmt  = n => Math.abs(Math.round(n || 0)).toLocaleString("en-CH");
  const fmtN = n => (n < 0 ? "−" : "") + "CHF " + fmt(n);

  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  platformEl.addEventListener("change", () => {
    const v = platformEl.value;

    if (v === "custom") {
      $("fee-display").style.display = "none";
      $("fee-custom-wrap").style.display = "block";
    } else {
      $("fee-display").style.display = "block";
      $("fee-custom-wrap").style.display = "none";
      $("fee-display").textContent = v + "%";
    }

    recalc();
  });

  countryEl.addEventListener("change", () => {
    $("country-note").textContent = countryEl.options[countryEl.selectedIndex].dataset.note || "";
    recalc();
  });

  holdEl.addEventListener("input", () => {
    const v = parseInt(holdEl.value);
    $("hold-lbl").textContent = `Hold time — ${v} month${v !== 1 ? "s" : ""}`;
    recalc();
  });

  function checkAiReady() {
    const ready =
      brandEl.value &&
      refEl.value.trim() &&
      parseFloat(purchaseEl.value) > 0 &&
      parseFloat(salePriceEl.value) > 0;

    aiBtn.disabled = !ready;
    $("ai-hint").style.display = ready ? "none" : "block";
  }

  document.querySelectorAll(".f-inp, .f-sel, .hold-slider").forEach(el => {
    el.addEventListener("input", () => {
      recalc();
      checkAiReady();
    });

    el.addEventListener("change", () => {
      recalc();
      checkAiReady();
    });
  });

  function getPlatformFee() {
    const v = platformEl.value;
    return v === "custom" ? (parseFloat(feeCustomEl.value) || 0) : (parseFloat(v) || 0);
  }

  function getCountry() {
    const opt = countryEl.options[countryEl.selectedIndex];

    return {
      code: countryEl.value,
      shortRate: parseFloat(opt.dataset.sr) || 0,
      longRate: parseFloat(opt.dataset.lr) || 0,
      longTermMonths: opt.dataset.lt ? parseInt(opt.dataset.lt) : null,
      allowance: parseFloat(opt.dataset.al) || 0,
      note: opt.dataset.note || "",
      flag: opt.textContent.split(" ")[0],
      name: opt.textContent.split(" ").slice(1).join(" ")
    };
  }

  function recalc() {
    const p    = parseFloat(purchaseEl.value)    || 0;
    const prem = (parseFloat(premiumEl.value)    || 0) / 100;
    const svc  = parseFloat(serviceEl.value)     || 0;
    const sIn  = parseFloat(shippingInEl.value)  || 0;
    const sale = parseFloat(salePriceEl.value)   || 0;
    const pFee = getPlatformFee() / 100;
    const sOut = parseFloat(shippingOutEl.value) || 0;
    const hold = parseInt(holdEl.value)           || 0;
    const c    = getCountry();

    if (p === 0 && sale === 0) {
      $("empty-state").style.display = "block";
      $("fin-result").style.display  = "none";
      return;
    }

    $("empty-state").style.display = "none";

    const costBasis   = p * (1 + prem) + svc + sIn;
    const netProceeds = sale * (1 - pFee) - sOut;
    const grossProfit = netProceeds - costBasis;
    const breakEven   = pFee < 1 ? (costBasis + sOut) / (1 - pFee) : 0;

    const isLongTerm = c.longTermMonths ? hold >= c.longTermMonths : false;
    const taxRate    = isLongTerm ? c.longRate : c.shortRate;
    const taxable    = c.code === "GB" ? Math.max(0, grossProfit - c.allowance) : Math.max(0, grossProfit);
    const taxOwed    = Math.max(0, taxable * taxRate);
    const netProfit  = grossProfit - taxOwed;
    const roi        = costBasis > 0 ? (netProfit / costBasis) * 100 : 0;
    const annRoi     = hold > 0 ? (roi / hold) * 12 : null;

    let holdRec = null;

    if (c.longTermMonths && hold < c.longTermMonths && grossProfit > 0) {
      const mLeft  = c.longTermMonths - hold;
      const ftax   = Math.max(0, taxable * c.longRate);
      const saving = taxOwed - ftax;

      if (saving > 10) {
        holdRec = {
          months: Math.ceil(mLeft),
          saving: Math.round(saving)
        };
      }
    }

    const pc = netProfit > 0 ? "#52c47a" : netProfit < 0 ? "#e06060" : "rgba(255,255,255,0.4)";
    const taxLabel = `Tax (${(taxRate * 100).toFixed(1)}%${isLongTerm ? " · long-term" : taxRate > 0 ? " · short-term" : ""})`;

    $("fin-result").innerHTML = `
      <div class="fu">
        <div class="r-sec"><span>Your numbers</span><div class="r-sec-line"></div></div>

        <div style="margin-bottom:1.25rem">
          <p class="r-label">${netProfit > 0 ? "Net profit" : netProfit < 0 ? "Net loss" : "Break-even"}</p>

          <div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap">
            <span style="font-family:'Georgia','Times New Roman',serif;font-size:42px;font-weight:200;letter-spacing:-0.03em;color:${pc};line-height:1">
              ${netProfit < 0 ? "−" : ""}CHF ${fmt(Math.abs(netProfit))}
            </span>

            <div style="display:flex;gap:6px;padding-bottom:5px">
              <span class="badge" style="background:${netProfit > 0 ? "rgba(82,196,122,0.1)" : netProfit < 0 ? "rgba(224,96,96,0.1)" : "rgba(255,255,255,0.05)"};color:${pc}">
                ${netProfit > 0 ? "+" : ""}${roi.toFixed(1)}% ROI
              </span>

              ${annRoi !== null ? `<span class="badge" style="background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.35)">${annRoi.toFixed(1)}% ann.</span>` : ""}
            </div>
          </div>
        </div>

        <div class="grad-rule"></div>

        <div class="metric-row"><span class="ml">Total cost basis</span><span class="mv">CHF ${fmt(costBasis)}</span></div>
        <div class="metric-row"><span class="ml">Net sale proceeds</span><span class="mv">CHF ${fmt(netProceeds)}</span></div>
        <div class="metric-row"><span class="ml">Gross profit</span><span class="mv" style="color:${grossProfit >= 0 ? "rgba(255,255,255,0.8)" : "#e06060"};font-weight:500">${fmtN(grossProfit)}</span></div>
        <div class="metric-row"><span class="ml">${taxLabel}</span><span class="mv" style="color:${taxOwed > 0 ? "#e06060" : "#52c47a"}">${taxOwed > 0 ? "− CHF " + fmt(taxOwed) : "None"}</span></div>

        <div style="display:flex;justify-content:space-between;padding:12px 0 16px">
          <span style="font-size:12px;color:rgba(255,255,255,0.55);font-weight:500">Net profit</span>
          <span style="font-size:16px;font-family:'Georgia','Times New Roman',serif;font-weight:500;color:${pc}">${netProfit < 0 ? "−" : ""}CHF ${fmt(Math.abs(netProfit))}</span>
        </div>

        <div class="r-card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div>
            <p class="r-label">Break-even sale price</p>
            <p class="r-val" style="font-size:17px;color:rgba(255,255,255,0.7)">CHF ${fmt(breakEven)}</p>
          </div>
        </div>

        ${holdRec ? `<div class="hold-rec"><p class="hold-rec-lbl">⏱ Hold recommendation</p><p class="hold-rec-txt">Hold <strong style="color:#c8a060">${holdRec.months} more month${holdRec.months !== 1 ? "s" : ""}</strong> to save <strong style="color:#c8a060">CHF ${fmt(holdRec.saving)}</strong> in tax.</p></div>` : ""}

        <div class="tax-note">${c.flag} ${c.name}: ${c.note}. Tax estimates only — consult a specialist.</div>
      </div>
    `;

    $("fin-result").style.display = "block";
  }

  aiBtn.addEventListener("click", async () => {
    const brand    = brandEl.value;
    const ref      = refEl.value.trim();
    const purchase = purchaseEl.value;
    const sale     = salePriceEl.value;

    if (!brand || !ref || !purchase || !sale) return;

    $("ai-loader").style.display = "block";
    $("ai-result").style.display = "none";
    $("ai-error").style.display  = "none";
    $("ai-error").textContent = "";

    aiBtn.disabled = true;
    aiBtn.textContent = "Assessing deal...";

    const platformName = platformEl.options[platformEl.selectedIndex].text.split(" (")[0];

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          tool: "flip",
          brand: brand,
          reference: ref,
          purchasePrice: purchase,
          salePrice: sale,
          platform: platformName,
          condition: "Excellent"
        })
      });

      const d = await res.json();

      if (!res.ok || d.error) {
        const apiMessage =
          d?.detail?.error?.message ||
          d?.detail?.message ||
          d?.detail?.error?.status ||
          d?.detail?.error?.code ||
          (typeof d?.detail === "string" ? d.detail : "") ||
          d?.error ||
          "AI assessment failed";

        throw new Error(apiMessage);
      }

      const viab = {
        strong:   { color:"#52c47a", bg:"rgba(82,196,122,0.1)", border:"rgba(82,196,122,0.2)", label:"Strong flip" },
        moderate: { color:"#c8a060", bg:"rgba(200,160,96,0.1)", border:"rgba(200,160,96,0.2)", label:"Moderate" },
        weak:     { color:"#e09040", bg:"rgba(224,144,64,0.1)", border:"rgba(224,144,64,0.2)", label:"Weak flip" },
        avoid:    { color:"#e06060", bg:"rgba(224,96,96,0.1)", border:"rgba(224,96,96,0.2)", label:"Avoid" }
      };

      const verd = {
        fair:             { color:"#c8a060", label:"Fair price" },
        overpaying:       { color:"#e06060", label:"Overpaying" },
        good_deal:        { color:"#52c47a", label:"Good deal" },
        unrealistic_sale: { color:"#e06060", label:"Unrealistic target" }
      };

      const v  = viab[d.flipViability] || viab.moderate;
      const pv = verd[d.priceVerdict] || verd.fair;
      const dc = d.demandLevel === "high" ? "#52c47a" : d.demandLevel === "medium" ? "#c8a060" : "#e06060";

      $("ai-result").innerHTML = `
        <div class="fu" style="margin-bottom:1.5rem">
          <div class="r-sec" style="margin-bottom:10px"><span>AI deal assessment</span><div class="r-sec-line"></div></div>

          <div class="two-col">
            <div style="background:${v.bg};border:0.5px solid ${v.border};border-radius:3px;padding:14px 16px">
              <p class="r-label" style="color:${v.color}99">Flip viability</p>
              <p style="font-size:18px;color:${v.color};font-weight:500">${v.label}</p>
            </div>

            <div class="r-card" style="margin-bottom:0">
              <p class="r-label">Purchase price</p>
              <p style="font-size:18px;color:${pv.color};font-weight:500">${pv.label}</p>
            </div>
          </div>

          <div class="r-card" style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <p class="r-label">Realistic sale range</p>
              <p class="r-val" style="font-size:20px;color:rgba(255,255,255,0.85)">CHF ${fmt(d.realisticRangeCHF?.low)} – ${fmt(d.realisticRangeCHF?.high)}</p>
            </div>

            <div style="text-align:right">
              <p class="r-label">Demand</p>
              <p style="font-size:13px;color:${dc};font-weight:500;text-transform:capitalize">${escapeHTML(d.demandLevel)}</p>
            </div>
          </div>

          <div class="narrative-block">
            <p class="narrative-text">${escapeHTML(d.verdictSummary)}</p>
          </div>

          <p style="font-size:11px;color:rgba(255,255,255,0.3);line-height:1.5;margin-bottom:10px;font-style:italic">${escapeHTML(d.liquidityNote)}</p>

          <div class="two-col">
            <div style="background:rgba(224,96,96,0.05);border:0.5px solid rgba(224,96,96,0.1);border-radius:3px;padding:14px">
              <p class="r-label" style="color:rgba(224,96,96,0.5)">Risk factors</p>
              ${(d.riskFactors || []).map(r => `<div style="display:flex;gap:8px;margin-bottom:8px"><span style="color:#e06060;font-size:9px;opacity:.6;padding-top:2px;flex-shrink:0">⚠</span><span style="font-size:12px;color:rgba(255,255,255,0.45);line-height:1.5">${escapeHTML(r)}</span></div>`).join("")}
            </div>

            <div style="background:rgba(82,196,122,0.05);border:0.5px solid rgba(82,196,122,0.1);border-radius:3px;padding:14px">
              <p class="r-label" style="color:rgba(82,196,122,0.5)">Flip tips</p>
              ${(d.flipTips || []).map(t => `<div style="display:flex;gap:8px;margin-bottom:8px"><span style="color:#52c47a;font-size:10px;opacity:.7;padding-top:1px;flex-shrink:0">→</span><span style="font-size:12px;color:rgba(255,255,255,0.45);line-height:1.5">${escapeHTML(t)}</span></div>`).join("")}
            </div>
          </div>

          <div style="padding:10px 14px;background:rgba(255,255,255,0.02);border:0.5px solid rgba(255,255,255,0.06);border-radius:3px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <span style="font-size:11px;color:rgba(255,255,255,0.3)">Best platform for this reference</span>
            <span style="font-size:12px;color:rgba(255,255,255,0.75);font-weight:500">${escapeHTML(d.bestPlatform)}</span>
          </div>

          <div style="height:0.5px;background:rgba(255,255,255,0.05);margin-bottom:16px"></div>
        </div>
      `;

      $("ai-result").style.display = "block";

    } catch(e) {
      console.error(e);
      $("ai-error").textContent = e.message || "AI assessment failed";
      $("ai-error").style.display = "block";
    }

    $("ai-loader").style.display = "none";
    aiBtn.disabled = false;
    aiBtn.textContent = "Assess this flip with AI";

    checkAiReady();
    recalc();
  });

  recalc();
  checkAiReady();
</script>
