<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BEZERU — Article</title>

  <!-- IMPORTANT: This must be a <link>, not <a> -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Header gets injected from script.js so watches/nav stay consistent -->
  <div id="site-header"></div>

  <main class="page">
    <div class="container">
      <a class="back-link" href="index.html">← Back to Home</a>

      <article class="article-shell">
        <div class="article-meta">
          <span class="article-badge" id="postCategory">Category</span>
          <span class="article-date" id="postDate"></span>
        </div>

        <h1 class="article-title" id="postTitle">Loading…</h1>
        <p class="article-excerpt" id="postExcerpt"></p>

        <div class="article-body" id="postBody"></div>
      </article>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="script.js"></script>
  <script>
    // Read ?id=... from URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    async function loadPost() {
      try {
        const res = await fetch("posts.json", { cache: "no-store" });
        const data = await res.json();
        const post = (data.posts || []).find(p => p.id === id);

        if (!post) {
          document.getElementById("postTitle").textContent = "Article not found";
          document.getElementById("postExcerpt").textContent =
            "The link may be wrong, or the post id is missing from posts.json.";
          return;
        }

        document.title = `BEZERU — ${post.title}`;
        document.getElementById("postCategory").textContent = post.category || "Article";
        document.getElementById("postDate").textContent = post.date || "";
        document.getElementById("postTitle").textContent = post.title || "";
        document.getElementById("postExcerpt").textContent = post.excerpt || "";
        document.getElementById("postBody").innerHTML = post.content_html || "";
      } catch (e) {
        document.getElementById("postTitle").textContent = "Couldn’t load article";
        document.getElementById("postExcerpt").textContent =
          "Check that posts.json is valid JSON and is in the same folder.";
      }
    }

    loadPost();
  </script>
</body>
</html>
