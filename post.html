<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BEZERU</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">BEZERU <small>ベゼル</small></a>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
  </nav>
</header>

<main class="wrap">

<a class="back" href="index.html">← Back to latest</a>

<article class="article" id="article">
  <p class="muted">Loading article…</p>
</article>

<footer class="footer">
  <div>© <span id="year"></span> BEZERU</div>
</footer>

</main>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const slug = new URLSearchParams(window.location.search).get("slug");

async function loadPost(){
  const res = await fetch("posts.json");
  const posts = await res.json();
  const post = posts.find(p => p.slug === slug) || posts[0];

  if(!post) throw new Error("No post found");

  document.title = post.title + " — BEZERU";

  document.getElementById("article").innerHTML = `
    <div class="post-meta">
      <span class="pill">${post.category}</span>
      <time>${formatDate(post.date)}</time>
    </div>

    <h1 class="article-title">${post.title}</h1>
    <p class="article-excerpt">${post.excerpt}</p>

    <div class="rule"></div>

    <div class="content">
      ${renderContent(post.content)}
    </div>
  `;
}

function renderContent(blocks){
  return blocks.map(b=>{
    if(b.type==="h2") return `<h2>${b.text}</h2>`;
    if(b.type==="ul") return `<ul>${b.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
    return `<p>${b.text}</p>`;
  }).join("");
}

function formatDate(d){
  const date = new Date(d+"T00:00:00");
  return date.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}

loadPost().catch(()=>{
  document.getElementById("article").innerHTML =
    "<h1>Post not found</h1><p>Return to the homepage and select a post.</p>";
});
</script>

</body>
</html>
