<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BEZERU — Article</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .postwrap{max-width:860px;margin:0 auto;padding:26px 16px 70px}
    .posthead{padding:18px 0;border-bottom:1px solid rgba(0,0,0,.08)}
    .posthead h1{margin:10px 0 6px;line-height:1.1;font-size:clamp(26px,4vw,42px)}
    .postmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:rgba(11,18,32,.65);font-size:13px}
    .back{display:inline-block;margin-top:12px;color:rgba(30,79,255,.95);font-weight:900}
    .article{padding:18px 0}
    .article p{font-size:16px;color:rgba(11,18,32,.82);line-height:1.8}
  </style>
</head>

<body>

  <div class="worldtime">
    <span><strong>NEW YORK</strong> <em id="tz-ny">--:--</em></span>
    <span><strong>LONDON</strong> <em id="tz-lon">--:--</em></span>
    <span><strong>GENEVA</strong> <em id="tz-gva">--:--</em></span>
    <span><strong>TOKYO</strong> <em id="tz-tyo">--:--</em></span>
  </div>

  <header class="mainbar">
    <a class="logo" href="index.html">BEZERU <small>ベゼル</small></a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a class="active" href="index.html#latest">Articles</a>
      <a href="index.html#latest">Brands</a>
      <a href="index.html#latest">Watch Types</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="postwrap">
    <div class="posthead">
      <div class="postmeta">
        <span class="pill" id="cat">Category</span>
        <time id="date">—</time>
      </div>
      <h1 id="title">Loading…</h1>
      <a class="back" href="index.html#latest">← Back to Latest</a>
    </div>

    <article class="article" id="content"></article>
  </main>

  <script>
    function setTZ(id, tz) {
      const el = document.getElementById(id);
      const fmt = new Intl.DateTimeFormat([], { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false });
      el.textContent = fmt.format(new Date());
    }
    function updateTimezones(){
      setTZ("tz-ny", "America/New_York");
      setTZ("tz-lon", "Europe/London");
      setTZ("tz-gva", "Europe/Zurich");
      setTZ("tz-tyo", "Asia/Tokyo");
    }
    updateTimezones();
    setInterval(updateTimezones, 15000);

    function qs(name){
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }
    function formatDate(iso) {
      const d = new Date(iso + "T00:00:00");
      return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    }
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function load(){
      const slug = qs("slug");
      const res = await fetch("posts.json", { cache: "no-store" });
      const posts = await res.json();
      const post = posts.find(p => p.slug === slug) || posts[0];

      document.title = `BEZERU — ${post.title}`;
      document.getElementById("title").textContent = post.title;
      document.getElementById("cat").textContent = post.category;
      document.getElementById("date").textContent = formatDate(post.date);

      const el = document.getElementById("content");
      el.innerHTML = (post.content || []).map(par => `<p>${escapeHtml(par)}</p>`).join("");
    }

    load().catch(() => {
      document.getElementById("title").textContent = "Could not load post.";
    });
  </script>
</body>
</html>
